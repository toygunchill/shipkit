# Reconstructed from acme/example-app: the section skeleton and the boilerplate
# below were recovered from merged pull-request bodies, because the template
# itself lives outside the repository and is not reachable from a checkout.
pr:
  # The ticket tag is not written by hand: the repository's "PR Open Workflow" action
  # derives it from the branch name and prepends it once the pull request opens. Requiring
  # it here made authors write a second one, and the title came out carrying both.
  titlePattern: '^(feat|fix|chore|ref|refactor|docs|test)(\([a-z0-9-]+\))?: .+'
  # Instruction lines the template injects. Left in place, they mean the author
  # answered nothing — so they are treated as unfilled placeholders.
  forbidden:
    - "TBD"
    - "TODO"
    - "<!--"
    - "Please link only parent Development-level Jira issues"
    - "Briefly describe what this PR does"
    - "Write it in a way that someone reading this"
    - "Describe **what should be tested**"
    - "Add images or videos if applicable."
    - "**Required when UI is affected:**"
  # Two pull requests sat green-but-unmergeable behind "in test" before this check existed;
  # declare it here so it actually fires for the repository it was written for.
  blockingLabels: ["in test"]
  sections:
    - name: Summary
      required: true
      hint: "5-6 lines: what was wrong and what changed, for someone who has not opened the diff"
    - name: Screenshots / Screen Recordings
      required: true
      hint: "Before/after, or one sentence saying why there is nothing to show"
    - name: What to Test
      required: true
      minItems: 3
      hint: "The checks a QA engineer needs, plus the obvious regressions"
    - name: Issues Addressed
      required: true
      minItems: 1
      hint: "Link at Story/Bug level, not the Development sub-task"
    - name: Analysis JIRA Issue
      required: false
branch:
  pattern: '^(feature|bugfix|livebug)/[a-z0-9]+/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
jira:
  baseUrl: https://jira.example.com
  keyPattern: 'DCP-\d+'
  section: Issues Addressed
  linkPolicy: story
